# 建材兑换券名称和描述。
voucher:
  name: '&5&l[建材兑换券]'
  lore:
    - '&7印有华丽纹章的兑换券'
    - '&7是在这个世界艰苦奋斗的证明'
    - '&7在需要的时候'
    - '&7也可以在菜单中换取建材'

