# 建材兑换券名称和描述。
voucher:
  name: '&5&l[建材兑换券]'
  lore:
    - '&7印有华丽纹章的兑换券'
    - '&7是在这个世界艰苦奋斗的证明'
    - '&7在需要的时候'
    - '&7也可以在菜单中换取建材'

# 兑换成功和失败的原版音效；volume 为 0 可静音，pitch 必须大于 0。
sounds:
  success:
    sound: minecraft:entity.experience_orb.pickup
    volume: 1.0
    pitch: 1.0
  failure:
    sound: minecraft:entity.villager.no
    volume: 1.0
    pitch: 1.0

